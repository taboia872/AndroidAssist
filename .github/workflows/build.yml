name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships the Android SDK (platforms, build-tools) with
      # ANDROID_HOME set — no setup-android action needed.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing key
        run: |
          echo "${{ secrets.AA_KEYSTORE_BASE64 }}" | base64 -d > /tmp/androidassist.keystore
          echo "AA_KEYSTORE_PATH=/tmp/androidassist.keystore" >> $GITHUB_ENV

      - name: Build debug APK (release-signed: installs over previous builds)
        env:
          AA_KEYSTORE_PATH: /tmp/androidassist.keystore
          AA_STORE_PASSWORD: ${{ secrets.AA_STORE_PASSWORD }}
          AA_KEY_ALIAS: ${{ secrets.AA_KEY_ALIAS }}
          AA_KEY_PASSWORD: ${{ secrets.AA_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
