name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing key
        run: |
          echo "${{ secrets.AA_KEYSTORE_BASE64 }}" | base64 -d > /tmp/androidassist.keystore
          echo "AA_KEYSTORE_PATH=/tmp/androidassist.keystore" >> $GITHUB_ENV

      - name: Build signed APKs
        env:
          AA_KEYSTORE_PATH: /tmp/androidassist.keystore
          AA_STORE_PASSWORD: ${{ secrets.AA_STORE_PASSWORD }}
          AA_KEY_ALIAS: ${{ secrets.AA_KEY_ALIAS }}
          AA_KEY_PASSWORD: ${{ secrets.AA_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
